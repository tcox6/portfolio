<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Projects</title>
        <link rel="stylesheet" href="./style.css">
        <link rel="stylesheet" href="/defaultStyles/style.css">
        <link rel="stylesheet" href="/defaultStyles/projectListStyle.css">
        <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
        <script src="/projects/scripts/set-featured-flag-false.js" defer></script>
        <script src="/projects/scripts/generate-project-html.js" defer></script>
        <script src="/footer/load-footer.js" defer></script>
    </head>
    <body>
        <div class="mainContent" id="mainContent">
            <!--LOAD HEADER-->
            <div id="header"></div>
            <script src="/header/load-header.js"></script>

            <div class="heading">
                <img src="/projects/assets/wrench.svg" alt="" class="spannerIconDesktop">
                <div class="blurb">
                    <p><img src="/projects/assets/wrench.svg" alt="" class="spannerIconMobile">Welcome to a compilation of my projects. The projects featured here are a mix of personal projects, as well as some of the more interesting assignments that I completed during my BICT coursework. Projects are listed in a pseudo-random order.</p>
                </div>
            </div>

            <div class="projectsContainer" id="projectsContainer">
                <div class="allProjectsHeading">
                    <h1>Projects</h1>
                </div>
                <div class="allProjects" id="allProjects"></div>
            </div>

            <div style="height: 36px;"></div>

            <!--FOOTER-->
            <div id="footer"></div>
        </div>

        <!--LOAD GAME OF LIFE BACKGROUND-->
        <canvas id="gameOfLifeCanvas"></canvas>
        <script src="/scripts/game-of-life.js"></script>
    </body>
</html>
