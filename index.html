<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim's Stuff (Personal Portfolio)</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="/defaultStyles/style.css">
    <link rel="stylesheet" href="/defaultStyles/projectListStyle.css">
    <link rel="stylesheet" href="/defaultStyles/fonts.css">
    <link rel="icon" href="./assets/favicon.ico" type="image/x-icon">
    <script src="projects/scripts/set-featured-flag-true.js" defer></script>
    <script src="projects/scripts/generate-project-html.js" defer></script>
    <script src="/footer/load-footer.js" defer></script>
    <script src="scripts/game-of-life.js" defer></script>
  </head>
  <body>
    <div class="mainContent" id="mainContent">
        <div class="firstViewPort">
            <!--LOAD HEADER-->
            <div id="header"></div>
            <script src="/header/load-header.js"></script>
            
            <div class="introduction">
                <p class="introductionBlurbTop" id="introductionTopBlurb"></p>
                <h1 id="introductionTitle"></h1>
                <p class="introductionBlurbBottom" id="introductionBottomBlurb"></p>
            </div>
            <script src="scripts/introduction.js"></script>
        </div>

        <div class="projectsContainer" id="projectsContainer">
            <div class="featuredProjectsHeading">
                <h1>Featured Projects</h1>
            </div>
            <div class="allProjects" id="allProjects"></div>
            <div class="moreProjects">
                <h3>This is just the start. View more projects <a href="/projects/">here</a>.</h3>
            </div>
        </div>
        <div class="bottomPadding"></div>

        <!--FOOTER (DYNAMICALLY LOADED)-->
        <div id="footer"></div>
    </div>

    <!--GAME OF LIFE BACKGROUND-->
    <canvas id="gameOfLifeCanvas"></canvas>
  </body>
</html>
